        <!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <title>Digital Clock</title>\
        <link rel="stylesheet" href="style.css">

        </head>
        <body>

        <div class="clock-card">
            <div id="time">--:--:--</div>
            <div id="date">-</div>
            <div class="controls">
            <button id="stopBtn">Stop</button>
            <button id="startBtn" disabled>Start</button>
            </div>
            <div id="status">running</div>
        </div>

        <script src="app.js"></script>

        </body>
        </html>
